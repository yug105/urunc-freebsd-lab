name: urunc full e2e

# A copy of urunc's .github/workflows/vm_test.yml (amd64), run against a
# urunc branch. The only differences: urunc is checked out from FIX_REPO at
# FIX_REF, and the binaries are built from that checkout instead of being
# downloaded as artifacts of the same CI run. Versions match ci.yml.

on:
  workflow_dispatch:
    inputs:
      fix_repo:
        description: Repository with the change under test
        default: yug105/urunc
      fix_ref:
        description: Branch, tag or SHA with the change
        default: main

permissions:
  contents: read

env:
  FIX_REPO: ${{ inputs.fix_repo }}
  FIX_REF: ${{ inputs.fix_ref }}
  RUNC_VERSION: '1.3.0'
  CONTAINERD_VERSION: '2.1.3'
  CNI_VERSION: '1.7.1'
  NERDCTL_VERSION: '2.1.3'
  CRICTL_VERSION: 'v1.30.0'
  FIRECRACKER_VERSION: 'v1.7.0'
  CLOUD_HYPERVISOR_VERSION: 'v50.0'
  SOLO5_VERSION: 'v0.9.3'
  HYPERLIGHT_UNIKRAFT_VERSION: 'v0.18.0'

jobs:
  e2e:
    name: ${{ matrix.test }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        test: ["test_ctr", "test_nerdctl", "test_crictl", "test_docker"]

    steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ env.FIX_REPO }}
        ref: ${{ env.FIX_REF }}

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: false

    - name: Install base dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git wget build-essential libseccomp-dev pkg-config bc make qemu-system jq
        wget https://s3.nbfc.io/nbfc-assets/github/urunc/bin/virtiofsd
        sudo chmod +x virtiofsd
        sudo mv virtiofsd /usr/libexec/virtiofsd

    - name: Install runc
      run: |
        wget -q "https://github.com/opencontainers/runc/releases/download/v${RUNC_VERSION}/runc.$(dpkg --print-architecture)"
        sudo install -m 755 runc.$(dpkg --print-architecture) /usr/local/sbin/runc
        rm -f ./runc.$(dpkg --print-architecture)

    - name: Install containerd
      run: |
        wget -q "https://github.com/containerd/containerd/releases/download/v${CONTAINERD_VERSION}/containerd-${CONTAINERD_VERSION}-linux-$(dpkg --print-architecture).tar.gz"
        sudo tar Cxzvf /usr/local "containerd-${CONTAINERD_VERSION}-linux-$(dpkg --print-architecture).tar.gz"
        rm -f "containerd-${CONTAINERD_VERSION}-linux-$(dpkg --print-architecture).tar.gz"

    - name: Set up containerd service
      run: |
        wget -q "https://raw.githubusercontent.com/containerd/containerd/v${CONTAINERD_VERSION}/containerd.service"
        sudo rm -f /lib/systemd/system/containerd.service
        sudo mv containerd.service /lib/systemd/system/containerd.service
        sudo systemctl daemon-reload
        sudo systemctl enable --now containerd

    - name: Configure containerd
      run: |
        sudo mkdir -p /etc/containerd/
        sudo mv /etc/containerd/config.toml /etc/containerd/config.toml.bak || true
        sudo containerd config default | sudo tee /etc/containerd/config.toml
        sudo systemctl restart containerd

    - name: Setup devmapper
      run: |
        sudo mkdir -p /usr/local/bin/scripts
        sudo cp script/dm_create.sh /usr/local/bin/scripts/dm_create.sh
        sudo chmod 755 /usr/local/bin/scripts/dm_create.sh
        sudo /usr/local/bin/scripts/dm_create.sh
        sudo sed -i "/\[plugins\.'io\.containerd\.snapshotter\.v1\.devmapper'\]/,/^$/d" /etc/containerd/config.toml
        sudo tee -a /etc/containerd/config.toml > /dev/null <<'EOT'
        [plugins.'io.containerd.snapshotter.v1.devmapper']
          pool_name = "containerd-pool"
          root_path = "/var/lib/containerd/io.containerd.snapshotter.v1.devmapper"
          base_image_size = "10GB"
          fs_type = "ext2"
        EOT
        sudo tee -a /etc/containerd/config.toml > /dev/null <<EOT
        [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.urunc]
            runtime_type = "io.containerd.urunc.v2"
            container_annotations = ["com.urunc.unikernel.*"]
            pod_annotations = ["com.urunc.unikernel.*"]
            snapshotter = "devmapper"
        EOT
        sudo systemctl restart containerd

    - name: Setup block-based mountpoint
      run: |
        mkdir /tmp/test_mountpoint
        dd if=/dev/zero of=/tmp/fake_block bs=1M count=200
        mkfs.ext2 /tmp/fake_block
        sudo mount /tmp/fake_block /tmp/test_mountpoint

    - name: Install CNI plugins
      run: |
        wget -q "https://github.com/containernetworking/plugins/releases/download/v${CNI_VERSION}/cni-plugins-linux-$(dpkg --print-architecture)-v${CNI_VERSION}.tgz"
        sudo mkdir -p /opt/cni/bin
        sudo tar Cxzvf /opt/cni/bin "cni-plugins-linux-$(dpkg --print-architecture)-v${CNI_VERSION}.tgz"
        rm -f "cni-plugins-linux-$(dpkg --print-architecture)-v${CNI_VERSION}.tgz"

    - name: Configure CNI network
      run: |
        sudo mkdir -p /etc/cni/net.d
        sudo tee /etc/cni/net.d/10-containerd-net.conflist > /dev/null <<'EOT'
        {
          "cniVersion": "1.0.0",
          "name": "containerd-net",
          "plugins": [
            {
              "type": "bridge",
              "bridge": "cni0",
              "isGateway": true,
              "ipMasq": true,
              "hairpinMode": true,
              "ipam": {
                "type": "host-local",
                "ranges": [
                  [{ "subnet": "10.88.0.0/16" }]
                ],
                "routes": [
                  { "dst": "0.0.0.0/0" }
                ]
              }
            },
            {
              "type": "portmap",
              "capabilities": { "portMappings": true }
            },
            {
              "type": "firewall"
            }
          ]
        }
        EOT
        sudo systemctl restart containerd

    - name: Install nerdctl
      run: |
        wget -q "https://github.com/containerd/nerdctl/releases/download/v${NERDCTL_VERSION}/nerdctl-${NERDCTL_VERSION}-linux-$(dpkg --print-architecture).tar.gz"
        sudo tar Cxzvf /usr/local/bin "nerdctl-${NERDCTL_VERSION}-linux-$(dpkg --print-architecture).tar.gz"
        rm -f "nerdctl-${NERDCTL_VERSION}-linux-$(dpkg --print-architecture).tar.gz"

    - name: Install crictl
      run: |
        wget "https://github.com/kubernetes-sigs/cri-tools/releases/download/${CRICTL_VERSION}/crictl-${CRICTL_VERSION}-linux-amd64.tar.gz"
        sudo tar zxvf "crictl-${CRICTL_VERSION}-linux-amd64.tar.gz" -C /usr/local/bin
        rm -f "crictl-${CRICTL_VERSION}-linux-amd64.tar.gz"
        sudo tee -a /etc/crictl.yaml > /dev/null <<'EOT'
        runtime-endpoint: unix:///run/containerd/containerd.sock
        image-endpoint: unix:///run/containerd/containerd.sock
        timeout: 20
        EOT

    - name: Install Firecracker
      run: |
        ARCH="$(uname -m)"
        release_url="https://github.com/firecracker-microvm/firecracker/releases"
        curl -L "${release_url}/download/${FIRECRACKER_VERSION}/firecracker-${FIRECRACKER_VERSION}-${ARCH}.tgz" | tar -xz
        sudo mv "release-${FIRECRACKER_VERSION}-${ARCH}/firecracker-${FIRECRACKER_VERSION}-${ARCH}" /usr/local/bin/firecracker
        rm -fr "release-${FIRECRACKER_VERSION}-${ARCH}"

    - name: Install Firecracker for FreeBSD
      env:
        FC_FREEBSD_VERSION: v1.16.1
      run: |
        ARCH="$(uname -m)"
        release_url="https://github.com/firecracker-microvm/firecracker/releases"
        curl -L "${release_url}/download/${FC_FREEBSD_VERSION}/firecracker-${FC_FREEBSD_VERSION}-${ARCH}.tgz" | tar -xz
        sudo mv "release-${FC_FREEBSD_VERSION}-${ARCH}/firecracker-${FC_FREEBSD_VERSION}-${ARCH}" /usr/local/bin/firecracker-freebsd
        rm -fr "release-${FC_FREEBSD_VERSION}-${ARCH}"

    - name: Install Cloud Hypervisor
      run: |
        curl -sL "https://github.com/cloud-hypervisor/cloud-hypervisor/releases/download/${CLOUD_HYPERVISOR_VERSION}/cloud-hypervisor-static" -o cloud-hypervisor
        chmod +x cloud-hypervisor
        sudo mv cloud-hypervisor /usr/local/bin/cloud-hypervisor

    - name: Install solo5
      run: |
        git clone -b "${SOLO5_VERSION}" https://github.com/Solo5/solo5.git /tmp/solo5
        cd /tmp/solo5
        ./configure.sh && make -j$(nproc)
        sudo cp tenders/hvt/solo5-hvt /usr/local/bin
        sudo cp tenders/spt/solo5-spt /usr/local/bin

    - name: Install hyperlight-unikraft
      run: |
        release_url="https://github.com/hyperlight-dev/hyperlight-unikraft/releases"
        curl -fsSL "${release_url}/download/${HYPERLIGHT_UNIKRAFT_VERSION}/hluk-${HYPERLIGHT_UNIKRAFT_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar -xz
        sudo install -m0755 hluk /usr/local/bin/hluk
        rm -f hluk

    - name: Build and install urunc from the branch under test
      run: |
        make
        sudo install -m 755 dist/urunc_static_amd64 /usr/local/bin/urunc
        sudo install -m 755 dist/containerd-shim-urunc-v2_static_amd64 /usr/local/bin/containerd-shim-urunc-v2
        urunc --version
        git log -1 --format='testing %H %s'

    - name: Configure urunc with debug logging
      run: |
        sudo mkdir -p /etc/urunc
        sudo tee /etc/urunc/config.toml > /dev/null <<'EOF'
        [log]
        level = "debug"
        syslog = true
        EOF

    - name: Configure FreeBSD urunc runtime (newer Firecracker)
      run: |
        sudo tee /etc/urunc/config-freebsd.toml > /dev/null <<'EOF'
        [log]
        level = "debug"
        syslog = true

        [monitors.firecracker]
        path = "/usr/local/bin/firecracker-freebsd"
        EOF

        sudo tee /usr/local/bin/containerd-shim-urunc-fc-v2 > /dev/null <<'EOF'
        #!/bin/bash
        URUNC_CONFIG_FILE=/etc/urunc/config-freebsd.toml exec /usr/local/bin/containerd-shim-urunc-v2 "$@"
        EOF
        sudo chmod +x /usr/local/bin/containerd-shim-urunc-fc-v2

    - name: Grant access to /dev/kvm
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Wait for CRI network to be ready
      run: |
        for _ in $(seq 1 30); do
          ready=$(sudo crictl info -o json 2>/dev/null | jq -r '.status.conditions[] | select(.type=="NetworkReady") | .status' || true)
          if [ "$ready" = "true" ]; then
            echo "CRI network is ready"
            exit 0
          fi
          sleep 2
        done
        echo "CRI network did not become ready in time"
        exit 1

    - name: Run ${{ matrix.test }}
      run: |
        export GOROOT=$(go env GOROOT)
        export PATH="$GOROOT/bin:$PATH"
        sudo -E env "PATH=$PATH" "GOROOT=$GOROOT" make ${{ matrix.test }}

    - name: Run ${{ matrix.test }} with libcontainer
      run: |
        sudo tee -a /etc/urunc/config.toml > /dev/null <<'EOF'

        [runtime]
        libcontainer = true
        EOF
        export GOROOT=$(go env GOROOT)
        export PATH="$GOROOT/bin:$PATH"
        sudo -E env "PATH=$PATH" "GOROOT=$GOROOT" make ${{ matrix.test }} SKIP="Firecracker-unikraft-httpreply-static-net"

    - name: Dump urunc logs on failure
      if: failure()
      run: |
        echo "=== urunc debug logs ==="
        sudo journalctl --identifier=urunc --no-pager | tail -n 500
